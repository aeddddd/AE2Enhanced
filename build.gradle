tasks.register('verifyServerScopeChain') {
    group = 'verification'
    outputs.upToDateWhen { false }
    doLast {
        def journal = scopeChainJournal.get()
        if (!journal.isFile()) {
            throw new GradleException('M2a scope chain failed: lifecycle journal is missing')
        }
        def rows = journal.readLines('UTF-8').findAll { !it.trim().isEmpty() }.collect { it.split('\t', -1) }
        def expectedOrder = ['A1', 'B', 'A2'].collectMany { phase -> ['started', 'stopping', 'stopped'].collect { event -> [phase, event] } }
        def actualOrder = rows.collect { [it.length > 1 ? it[0] : '', it.length > 1 ? it[1] : ''] }
        if (rows.size() != 9 || actualOrder != expectedOrder) {
            throw new GradleException('M2a scope chain failed: expected A1/B/A2 started-stopping-stopped order, got ' + actualOrder)
        }
        def byPhase = ['A1', 'B', 'A2'].collectEntries { phase -> [phase, rows.findAll { it[0] == phase }] }
        byPhase.each { phase, events ->
            def started = events[0]
            def stopping = events[1]
            def stopped = events[2]
            if (started[2] != stopped[2] || started[3] != stopping[3] || started[3] != stopped[3]) {
                throw new GradleException("M2a scope chain failed: ${phase} root/scope identity changed")
            }
            if (started[4] != '1' || !started[5].isInteger() || started[5].toInteger() < 2
                    || started[6] != 'true' || started[7] != 'false' || started[8] != 'true') {
                throw new GradleException("M2a scope chain failed: ${phase} started evidence is invalid")
            }
            [stopping, stopped].each { event ->
                if (event[4] != '0' || event[5] != '0' || event[6] != 'false' || event[7] != 'true') {
                    throw new GradleException("M2a scope chain failed: ${phase} close evidence is invalid")
                }
            }
            if (stopping[8] != 'true' || stopped[8] != 'false') {
                throw new GradleException("M2a scope chain failed: ${phase} release order is invalid")
            }
        }
        if (!providers.gradleProperty('storageVerification').isPresent()
                && (byPhase.A1[0][2] != byPhase.A2[0][2] || byPhase.A1[0][2] == byPhase.B[0][2])) {
            throw new GradleException('M2a scope chain failed: save roots are not A/B/A isolated')
        }
        if ([byPhase.A1[0][3], byPhase.B[0][3], byPhase.A2[0][3]].toSet().size() != 3) {
            throw new GradleException('M2a scope chain failed: scope IDs were reused')
        }
        if (providers.gradleProperty('storageVerification').isPresent()) {
            ['A1', 'B', 'A2'].each { phase ->
                def log = new File(scopeChainDir.get().asFile, "${phase}-latest.log").getText('UTF-8')
                if (log.count('STORAGE_CHANNEL_PASS') != 1) {
                    throw new GradleException("storage channel verification failed: ${phase} marker missing")
                }
            }
        }
        def report = scopeChainReportDir.get().asFile
        delete(report)
        report.mkdirs()
        copy { from journal; into report }
        byPhase.keySet().each { phase ->
            copy { from(new File(scopeChainDir.get().asFile, "${phase}-latest.log")); into report }
        }
        logger.lifecycle('[AE2Enhanced] M2a real-server A1/B/A2 scope chain verified; reports: ' + report)
    }
}

runServerScopeChainA2.configure {
    finalizedBy verifyServerScopeChain
}

