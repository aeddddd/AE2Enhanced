// ============================================================================
// AE2Enhanced —— Minecraft 1.12.2 / Forge Mod
// 构建链: RetroFuturaGradle 2.0.3 (Gradle 9.7 / 构建 JVM 需 Java 25, 编译目标 Java 8)
// 结构参照 CleanroomMC ForgeDevEnv 模板: 所有版本常量集中在 gradle.properties
// ============================================================================

plugins {
    id 'java'
    id 'java-library'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
}

// ----------------------------------------------------------------------------
// Mod 元数据（值见 gradle.properties）
// ----------------------------------------------------------------------------
version = project.mod_version
group = project.maven_group
base {
    archivesName.set(project.archives_base_name)
}

// ----------------------------------------------------------------------------
// Java 8 工具链（本机 JDK 8 自动检测, 缺失时由 foojay 自动下载）/ UTF-8 编译
// ----------------------------------------------------------------------------
java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ----------------------------------------------------------------------------
// Minecraft / Forge / Mappings
// RFG 对 1.12.2 内置默认 Forge 14.23.5.2847 (IMinecraftyExtension#getForgeVersion)
// ----------------------------------------------------------------------------
minecraft {
    mcVersion.set(project.minecraft_version)
    mcpMappingChannel.set(project.mapping_channel)
    mcpMappingVersion.set(project.mapping_version)

    username.set('Developer')
    extraRunJvmArguments.addAll(['-ea:' + project.group, '-Dmixin.checks.interfaces=true'])
}

// ----------------------------------------------------------------------------
// 仓库
// ----------------------------------------------------------------------------
repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } // Mixin
    maven { url = 'https://dvs1.progwml6.com/files/maven' }                   // JEI
    maven { url = 'https://maven.blamejared.com' }                            // CraftTweaker / Botania
    maven { url = 'https://maven.cleanroommc.com' }                           // MixinBooter
    maven { url = 'https://maven.modmuss50.me' }                              // TechReborn / RebornCore
    maven { url = 'https://www.cursemaven.com' }                              // CurseForge mods (curse.maven:<slug>-<projectId>:<fileId>)

    // GitHub Release 直链 (Ivy pattern layout, 仅构件无元数据; [revision] 映射到 release tag)
    ivy {
        name = 'GitHub-ae2uel'
        url = 'https://github.com/AE2-UEL/Applied-Energistics-2/releases/download'
        patternLayout { artifact 'v[revision]/ae2-uel-v[revision].[ext]' }
        metadataSources { artifact() }
    }
    ivy {
        name = 'GitHub-thaumic-energistics'
        url = 'https://github.com/Delfayne/ThaumicEnergistics/releases/download'
        patternLayout { artifact 'v[revision]/thaumic-energistics-extended-life-1.12.2-[revision].[ext]' }
        metadataSources { artifact() }
    }
    ivy {
        name = 'GitHub-cells'
        url = 'https://github.com/Aedial/CELLS/releases/download'
        patternLayout { artifact '[revision]/cells-[revision].[ext]' }
        metadataSources { artifact() }
    }
    ivy {
        name = 'GitHub-cell-terminal'
        url = 'https://github.com/Aedial/DiskTerminal/releases/download'
        patternLayout { artifact '[revision]/cell-terminal-[revision]-dev.[ext]' }
        metadataSources { artifact() }
    }
}

configurations {
    mixinAgent {
        canBeConsumed = false
        canBeResolved = true
        visible = false
    }
    specialSource {
        canBeConsumed = false
        canBeResolved = true
        visible = false
    }
}

// ----------------------------------------------------------------------------
// 依赖
// 注意: AE2-UEL 不得包 rfg.deobf() —— 开发环境运行时由 FML 做 SRG→MCP 重映射,
// 且 remap=false mixin 直接以 SRG 名为目标, 预反混淆会破坏二者。
// ----------------------------------------------------------------------------
dependencies {
    implementation 'ae2uel:ae2-uel:0.56.7'

    // 可选集成 (compileOnly): 第三方 mod 类一律通过反射隔离访问,
    // 运行时按对应 mod 是否安装进行条件加载

    compileOnly files('libs/Mekanism-CE-Unofficial-All-10.0.3.550-dev.jar')

    // --- CurseForge ---
    compileOnly 'curse.maven:mekanism-268560:2835175'                                // Mekanism 9.8.3.390
    compileOnly 'curse.maven:thaumcraft-223628:2629023'                              // Thaumcraft 6.1.BETA26
    compileOnly 'curse.maven:baubles-227083:2518667'                                 // Baubles 1.5.2
    compileOnly 'curse.maven:draconic-evolution-223565:3431261'                      // Draconic Evolution 2.3.28.354
    compileOnly 'curse.maven:ender-io-64578:4674244'                                 // EnderIO 5.3.72
    compileOnly 'curse.maven:endercore-231868:4671384'                               // EnderCore 0.5.78
    compileOnly 'curse.maven:cofh-core-69162:2920433'                                // CoFHCore 4.6.6.1
    compileOnly 'curse.maven:thermal-expansion-69163:2926431'                        // ThermalExpansion 5.5.7.1
    compileOnly 'curse.maven:thermal-foundation-222880:2926428'                      // ThermalFoundation 2.6.7.1
    compileOnly 'curse.maven:blood-magic-224791:2822288'                             // BloodMagic 2.4.3-105
    compileOnly 'curse.maven:actually-additions-228404:3117927'                      // ActuallyAdditions r152
    compileOnly 'curse.maven:nuclearcraft-overhauled-336895:8197222'                 // NuclearCraft: Overhauled 2o.9.7
    compileOnly 'curse.maven:storage-drawers-223852:4655859'                         // StorageDrawers 5.5.0
    compileOnly 'curse.maven:projecte-226410:2702991'                                // ProjectE PE1.4.1
    compileOnly 'curse.maven:industrial-foregoing-266515:2745321'                    // IndustrialForegoing 1.12.13-237
    compileOnly 'curse.maven:ae2fluidcraft-rework-unofficial-1404390:7742544'        // ae2fc 2.7.10-unofficial
    compileOnly 'curse.maven:mekanism-energistics-1027681:5775101'                   // MekanismEnergistics 0.1.5
    compileOnly 'curse.maven:modularmachinery-community-edition-817377:6945422'      // ModularMachinery-CE 2.2.2
    compileOnly 'curse.maven:extended-crafting-nomifactory-edition-398267:4592627'   // ExtendedCrafting Nomifactory 1.7.0.6
    compileOnly 'curse.maven:functionalstoragelegacy-1481727:8081067'                // FunctionalStorageLegacy 1.0.3-beta

    // --- GitHub Release ---
    compileOnly 'thaumicenergistics:thaumic-energistics:2.3.5'                       // ThaumicEnergistics Extended Life
    compileOnly 'cells:cells:0.6.2-alpha3'
    compileOnly 'cellterminal:cell-terminal:1.6.7'
    // TII: GitHub Release 上的 1.0.0 构件过旧(缺少 getEmptyContainer 等接口方法),
    // 必须使用 libs/ 下的新版本地构件
    compileOnly files('libs/terminal_interaction_integration-1.0.jar')

    // --- 公共 Maven  ---
    compileOnly('vazkii.botania:Botania:r1.10-364.4') { transitive = false }
    compileOnly('TechReborn:TechReborn-1.12.2:2.27.3.1084:universal') { transitive = false }
    compileOnly('RebornCore:RebornCore-1.12.2:3.19.4.529:universal') { transitive = false }

    // Mixin: MixinBooter + refmap 生成 (RFG modUtils 取代 MixinGradle 0.6)
    String mixin = modUtils.enableMixins("zone.rong:mixinbooter:${project.mixin_booter_version}", 'mixin.refmap.json')
    implementation(mixin) { transitive = false }
    annotationProcessor "org.spongepowered:mixin:${project.mixin_version}:processor"
    add('mixinAgent', mixin) { transitive = false }

    // fastutil
    implementation "it.unimi.dsi:fastutil:${project.fastutil_version}"

    // JEI / CraftTweaker (JEI 完整 jar 同时供编译与开发运行时; CT 仅编译期)
    implementation rfg.deobf("mezz.jei:jei_${project.minecraft_version}:${project.jei_version}")
    compileOnly rfg.deobf("mezz.jei:jei_${project.minecraft_version}:${project.jei_version}:api")
    compileOnly rfg.deobf("CraftTweaker2:CraftTweaker2-MC1120-Main:${project.crafttweaker_version}")

    // 单元测试用 SRG→MCP 重映射工具 (显式依赖, 不再从构建插件缓存目录取 jar)
    specialSource 'net.md-5:SpecialSource:1.8.3:shaded'

    // JUnit 5
    testImplementation "org.junit.jupiter:junit-jupiter-api:${project.junit_version}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${project.junit_version}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${project.junit_version}"
    // Gradle 9 起不再自动注入 JUnit Platform Launcher, 必须显式声明
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${project.junit_platform_version}"

    // 测试断言与 mock(Java 8 兼容版本)
    testImplementation "org.assertj:assertj-core:3.11.1"
    testImplementation "org.mockito:mockito-core:2.23.4"

    // 仅为测试运行时提供 yalter.mousetweaks.api(该 jar 捆绑了此 API):
    // AE2 AEBaseGui 实现 IMTModGuiContainer2, 测试加载 GUI 类时必须能解析到
    testRuntimeOnly 'cells:cells:0.6.2-alpha3'
}

// RFG 默认只把 LWJGL 加入编译 classpath (run 任务单独挂载), 测试运行时需显式继承,
// 否则 Mockito 反射 net.minecraft.client.Minecraft 构造器时找不到 org.lwjgl 类
configurations.testRuntimeClasspath.extendsFrom(configurations.lwjgl2Classpath)

// 调试模式 (task.debug) 下以 javaagent 挂载 Mixin
['runClient', 'runServer', 'runObfClient', 'runObfServer'].each { taskName ->
    tasks.named(taskName, JavaExec).configure { JavaExec task ->
        task.doFirst {
            if (task.debug) {
                task.jvmArgs("-javaagent:${configurations.mixinAgent.singleFile.absolutePath}")
            }
        }
    }
}

test {
    useJUnitPlatform()
    dependsOn 'remapAe2ForTest'
    // 全套测试共享一个 JVM, AE2/MC 类加载累积量大, 512m 默认堆会 GC overhead OOM
    maxHeapSize = '2g'
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    })
    // 诊断基准类(test/bench/**,零断言纯观测)不纳入默认测试运行;
    // 手动运行: ./gradlew test -Pbench(可叠加 AE2E_BENCH=1 获得 3g 堆)
    if (!project.hasProperty('bench')) {
        exclude '**/test/bench/**'
    }
    // 极端规模基准(AE2E_BENCH=1 启用):放大堆并把基准输出直通控制台
    if (System.getenv('AE2E_BENCH') != null) {
        maxHeapSize = '3g'
        testLogging { showStandardStreams = true }
    }
}

// ----------------------------------------------------------------------------
// 单元测试环境: 开发环境运行时 MC 为 MCP 命名,而 AE2-UEL jar 保留 SRG 名
// (field_*/func_*),普通 JVM 测试无运行时重映射器,需预先用 SpecialSource 将
// AE2 jar 从 SRG 重映射到 MCP,并替换 test 运行时 classpath 中的原始 jar
// (编译 classpath 不变——javac 不解析 jar 内部的 MC 成员名)。
// srg-mcp 映射文件直接取 RFG generateForgeSrgMappings 任务的产物。
// ----------------------------------------------------------------------------
def ae2McpJar = layout.buildDirectory.file('testLibs/ae2-uel-mcp.jar')
def genSrgMappings = tasks.named('generateForgeSrgMappings')

tasks.register('remapAe2ForTest', JavaExec) {
    dependsOn genSrgMappings
    inputs.file(genSrgMappings.flatMap { it.srgToMcp })
    outputs.file(ae2McpJar)
    outputs.upToDateWhen { ae2McpJar.get().asFile.exists() }
    mainClass.set('net.md_5.specialsource.SpecialSource')
    classpath = configurations.specialSource
    doFirst {
        def ae2Jar = configurations.compileClasspath.find { it.name.startsWith('ae2-uel') }
        assert ae2Jar != null: 'AE2-UEL artifact not found in compileClasspath'
        args = ['-i', ae2Jar.absolutePath,
                '-o', ae2McpJar.get().asFile.absolutePath,
                '-m', genSrgMappings.get().srgToMcp.get().asFile.absolutePath]
    }
}

afterEvaluate {
    // 以 MCP 重映射版替换 test 运行时 classpath 中的 SRG 版 AE2 jar
    sourceSets.test.runtimeClasspath = sourceSets.test.runtimeClasspath
            .filter { !it.name.startsWith('ae2-uel') } + files(ae2McpJar)
}

// ----------------------------------------------------------------------------
// 资源处理: 展开 mcmod.info 中的 ${version} / ${mcversion} 模板变量
// ----------------------------------------------------------------------------
processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft_version
    filesMatching('mcmod.info') { fcd ->
        fcd.expand('version': project.version, 'mcversion': project.minecraft_version)
    }
}

// ----------------------------------------------------------------------------
// runClient: 若 run/mods 中存在 HEI 则排除运行 classpath 上的原版 JEI, 避免类冲突。
// RFG 下 compileOnly 不再泄漏进运行 classpath, 旧版 FG2 的 mod jar 剥离/去重逻辑
// 已无存在必要; 需要联调可选 mod 时把 jar 放进 run/mods/ 即可(FML 照常扫描)。
// ----------------------------------------------------------------------------
afterEvaluate {
    tasks.named('runClient', JavaExec) {
        doFirst {
            // 先快照原始 classpath, 闭包内不得再引用 classpath 自身(否则 filter 递归求值 → StackOverflow)
            def original = classpath
            def hasHEI = fileTree('run/mods').matching { include '**/HadEnoughItems*.jar' }.files.size() > 0
            if (hasHEI) {
                classpath = files(original.filter { file ->
                    if (file.name.contains("jei_${project.minecraft_version}")) {
                        println "[AE2Enhanced] runClient: excluded JEI jar " + file.name + " (HEI detected in run/mods)."
                        return false
                    }
                    return true
                })
            }
        }
    }
}

// ----------------------------------------------------------------------------
// runServer: 独立(专用)服务端的运行环境 —— 独立目录 runServer/, 并一律排除 JEI:
// 服务端不需要 HEI/JEI, 也不接受任何客户端专属 mod 进入专用服务端 classpath。
//
// 用法:
//   ./gradlew runServer            # 前台运行; 首次运行前需在 runServer/eula.txt 里写 eula=true
//   ./gradlew runServer --args='--nogui'
// 服务端 mods 目录是 runServer/mods/(默认空); 需要联调可选 mod 时把 jar 放进去。
// 客户端连入: 开发客户端 Multiplayer → Direct Connect → localhost。
// ----------------------------------------------------------------------------
afterEvaluate {
    tasks.named('runServer', JavaExec) {
        // 独立运行目录(覆盖 RFG 默认的 run/)
        workingDir = file('runServer')
        // Gradle 的 JavaExec 默认不把 stdin 接给子进程: MC 服务端(nogui 模式)会立刻读到 EOF
        // 然后"干净退出"(BUILD SUCCESSFUL, 但服务端根本没起来)。接上 stdin 即可。
        standardInput = System.in
        doFirst {
            def original = classpath
            classpath = files(original.filter { file ->
                if (file.name.contains("jei_${project.minecraft_version}")) {
                    println "[AE2Enhanced] runServer: excluded JEI jar " + file.name + " (dedicated server does not need it)."
                    return false
                }
                return true
            })
        }
    }
}

// ----------------------------------------------------------------------------
// 打包: 排除 JEI stub、按白名单打包 fastutil、写入 FML CorePlugin manifest。
// RFG 下 jar 任务产出 -dev 分类器的开发 jar, 发布 jar 由 reobfJar 产出(无分类器,
// 文件名与旧构建链一致: build/libs/AE2Enhanced-<version>.jar)。
// ----------------------------------------------------------------------------
jar {
    // 排除 JEI 内部类的编译期 stub, 避免与运行时 JEI/HEI 的类冲突
    exclude 'mezz/jei/**'

    // fastutil 瘦身白名单: 本 mod + AE2-UEL 对 fastutil 静态引用(常量池)的传递闭包,
    // 由 research/tools/fastutil_closure.py 生成。fastutil 或 AE2 版本升级后需重新生成:
    //   python research/tools/fastutil_closure.py build/libs/AE2Enhanced-<version>.jar \
    //       libs/ae2-uel-v0.56.7.jar <gradle缓存中的fastutil.jar> fastutil-whitelist.txt
    def fastutilWhitelist = file('fastutil-whitelist.txt').readLines('UTF-8') as Set

    // 打包 fastutil, 仅保留白名单中的类
    from({
        configurations.compileClasspath.findAll { it.name.contains('fastutil') }.collect { zipTree(it) }
    }) {
        eachFile { fc ->
            if (fc.path.endsWith('.class') && fc.path.startsWith('it/unimi/dsi/fastutil/')
                    && !fastutilWhitelist.contains(fc.path)) {
                fc.exclude()
            }
        }
    }

    manifest {
        attributes([
            'FMLCorePluginContainsFMLMod': true,
            'ForceLoadAsMod': true,
            'FMLCorePlugin': 'com.github.aeddddd.ae2enhanced.mixin.AssemblyMixinPlugin'
        ])
    }

    // 第三方素材许可声明随产物分发：licenses/ 目录下的 .txt 全部打进 jar 根（MEST / AE2 各自一份），
    // 这样玩家拿到 jar 也能看到署名与许可条款（CC BY-NC-SA 3.0 要求保留署名与该条款）。
    from('licenses') {
        include '*.txt'
        into 'licenses'
    }
}
