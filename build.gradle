// ============================================================================
// AE2Enhanced —— Minecraft 1.12.2 / Forge Mod
// 构建链: ForgeGradle 2.3-SNAPSHOT + MixinGradle 0.6 (Java 8 / Gradle 4.10.3)
// 结构参照 Forge MDK / Cleanroom 1.12.2 模板: 所有版本常量集中在 gradle.properties
// ============================================================================

buildscript {
    repositories {
        maven { url = 'https://files.minecraftforge.net/maven' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'org.spongepowered.mixin'

// ----------------------------------------------------------------------------
// Mod 元数据（值见 gradle.properties）
// ----------------------------------------------------------------------------
version = project.mod_version
group = project.maven_group
archivesBaseName = project.archives_base_name

// ----------------------------------------------------------------------------
// Java 8 / UTF-8 编译
// ----------------------------------------------------------------------------
sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8
compileJava {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8
    options.encoding = 'UTF-8'
}
compileTestJava {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8
    options.encoding = 'UTF-8'
}

// ----------------------------------------------------------------------------
// Minecraft / Forge / Mappings（值见 gradle.properties）
// ----------------------------------------------------------------------------
minecraft {
    version = "${project.minecraft_version}-${project.forge_version}"
    runDir = 'run'
    mappings = project.mcp_mappings
}

// ----------------------------------------------------------------------------
// 仓库
// ----------------------------------------------------------------------------
repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } // Mixin
    maven { url = 'https://dvs1.progwml6.com/files/maven' }                   // JEI
    maven { url = 'https://maven.blamejared.com' }                            // CraftTweaker / Botania
    maven { url = 'https://maven.cleanroommc.com' }                           // MixinBooter
    maven { url = 'https://maven.modmuss50.me' }                              // TechReborn / RebornCore
    maven { url = 'https://www.cursemaven.com' }                              // CurseForge mods (curse.maven:<slug>-<projectId>:<fileId>)

    // GitHub Release 直链 (Ivy pattern layout, 仅构件无元数据; [revision] 映射到 release tag)
    ivy {
        name = 'GitHub-ae2uel'
        url = 'https://github.com/AE2-UEL/Applied-Energistics-2/releases/download'
        layout 'pattern', { artifact 'v[revision]/ae2-uel-v[revision].[ext]' }
        metadataSources { artifact() }
    }
    ivy {
        name = 'GitHub-thaumic-energistics'
        url = 'https://github.com/Delfayne/ThaumicEnergistics/releases/download'
        layout 'pattern', { artifact 'v[revision]/thaumic-energistics-extended-life-1.12.2-[revision].[ext]' }
        metadataSources { artifact() }
    }
    ivy {
        name = 'GitHub-cells'
        url = 'https://github.com/Aedial/CELLS/releases/download'
        layout 'pattern', { artifact '[revision]/cells-[revision].[ext]' }
        metadataSources { artifact() }
    }
    ivy {
        name = 'GitHub-cell-terminal'
        url = 'https://github.com/Aedial/DiskTerminal/releases/download'
        layout 'pattern', { artifact '[revision]/cell-terminal-[revision]-dev.[ext]' }
        metadataSources { artifact() }
    }
    ivy {
        name = 'GitHub-terminal-interaction-integration'
        url = 'https://github.com/NNYYOONNIIOO/terminal_interaction_integration/releases/download'
        layout 'pattern', { artifact '[revision]/terminal_interaction_integration-1.0.[ext]' }
        metadataSources { artifact() }
    }
}

// ----------------------------------------------------------------------------
// 依赖
// ----------------------------------------------------------------------------
dependencies {
    compile 'ae2uel:ae2-uel:0.56.7'

    // 可选集成 (compileOnly): 第三方 mod 类一律通过反射隔离访问,
    // 运行时按对应 mod 是否安装进行条件加载

    compileOnly files('libs/Mekanism-CE-Unofficial-All-10.0.3.550-dev.jar')

    // --- CurseForge ---
    compileOnly 'curse.maven:mekanism-268560:2835175'                                // Mekanism 9.8.3.390
    compileOnly 'curse.maven:thaumcraft-223628:2629023'                              // Thaumcraft 6.1.BETA26
    compileOnly 'curse.maven:baubles-227083:2518667'                                 // Baubles 1.5.2
    compileOnly 'curse.maven:draconic-evolution-223565:3431261'                      // Draconic Evolution 2.3.28.354
    compileOnly 'curse.maven:ender-io-64578:4674244'                                 // EnderIO 5.3.72
    compileOnly 'curse.maven:endercore-231868:4671384'                               // EnderCore 0.5.78
    compileOnly 'curse.maven:cofh-core-69162:2920433'                                // CoFHCore 4.6.6.1
    compileOnly 'curse.maven:thermal-expansion-69163:2926431'                        // ThermalExpansion 5.5.7.1
    compileOnly 'curse.maven:thermal-foundation-222880:2926428'                      // ThermalFoundation 2.6.7.1
    compileOnly 'curse.maven:blood-magic-224791:2822288'                             // BloodMagic 2.4.3-105
    compileOnly 'curse.maven:actually-additions-228404:3117927'                      // ActuallyAdditions r152
    compileOnly 'curse.maven:nuclearcraft-overhauled-336895:8197222'                 // NuclearCraft: Overhauled 2o.9.7
    compileOnly 'curse.maven:storage-drawers-223852:4655859'                         // StorageDrawers 5.5.0
    compileOnly 'curse.maven:projecte-226410:2702991'                                // ProjectE PE1.4.1
    compileOnly 'curse.maven:industrial-foregoing-266515:2745321'                    // IndustrialForegoing 1.12.13-237
    compileOnly 'curse.maven:ae2fluidcraft-rework-unofficial-1404390:7742544'        // ae2fc 2.7.10-unofficial
    compileOnly 'curse.maven:mekanism-energistics-1027681:5775101'                   // MekanismEnergistics 0.1.5
    compileOnly 'curse.maven:modularmachinery-community-edition-817377:6945422'      // ModularMachinery-CE 2.2.2
    compileOnly 'curse.maven:extended-crafting-nomifactory-edition-398267:4592627'   // ExtendedCrafting Nomifactory 1.7.0.6
    compileOnly 'curse.maven:functionalstoragelegacy-1481727:8081067'                // FunctionalStorageLegacy 1.0.3-beta

    // --- GitHub Release ---
    compileOnly 'thaumicenergistics:thaumic-energistics:2.3.5'                       // ThaumicEnergistics Extended Life
    compileOnly 'cells:cells:0.6.2-alpha3'
    compileOnly 'cellterminal:cell-terminal:1.6.7'
    compileOnly 'tii:terminal-interaction-integration:1.0.0'

    // --- 公共 Maven  ---
    compileOnly('vazkii.botania:Botania:r1.10-364.4') { transitive = false }
    compileOnly('TechReborn:TechReborn-1.12.2:2.27.3.1084:universal') { transitive = false }
    compileOnly('RebornCore:RebornCore-1.12.2:3.19.4.529:universal') { transitive = false }

    // Mixin: MixinBooter + 注解处理器
    compile('zone.rong:mixinbooter:10.6') { transitive = false }
    annotationProcessor "org.spongepowered:mixin:${project.mixin_version}:processor"

    // fastutil
    compile "it.unimi.dsi:fastutil:${project.fastutil_version}"

    // JEI / CraftTweaker
    deobfProvided "mezz.jei:jei_${project.minecraft_version}:${project.jei_version}:api"
    deobfProvided "mezz.jei:jei_${project.minecraft_version}:${project.jei_version}"
    deobfProvided "CraftTweaker2:CraftTweaker2-MC1120-Main:${project.crafttweaker_version}"

    // JUnit 5
    testImplementation "org.junit.jupiter:junit-jupiter-api:${project.junit_version}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${project.junit_version}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${project.junit_version}"

    // 测试断言与 mock(Java 8 兼容版本)
    testImplementation "org.assertj:assertj-core:3.11.1"
    testImplementation "org.mockito:mockito-core:2.23.4"
}

test {
    useJUnitPlatform()
    dependsOn 'remapAe2ForTest'
    // 诊断基准类(test/bench/**,零断言纯观测)不纳入默认测试运行;
    // 手动运行: ./gradlew test -Pbench(可叠加 AE2E_BENCH=1 获得 3g 堆)
    if (!project.hasProperty('bench')) {
        exclude '**/test/bench/**'
    }
    // 极端规模基准(AE2E_BENCH=1 启用):放大堆并把基准输出直通控制台
    if (System.getenv('AE2E_BENCH') != null) {
        maxHeapSize = '3g'
        testLogging { showStandardStreams = true }
    }
}

// ----------------------------------------------------------------------------
// 单元测试环境: 本开发环境运行时 MC 为 MCP 命名(Cleanroom 风格),而 AE2-UEL jar
// 保留 SRG 名(field_*/func_*),普通 JVM 测试无运行时重映射器,需预先用
// SpecialSource 将 AE2 jar 从 SRG 重映射到 MCP,并替换 test 运行时 classpath 中的
// 原始 jar(编译 classpath 不变——javac 不解析 jar 内部的 MC 成员名).
// ----------------------------------------------------------------------------
def srgToMcpSrg = "${gradle.gradleUserHomeDir}/caches/minecraft/de/oceanlabs/mcp/mcp_stable/39/1.12.2/srgs/srg-mcp.srg"
def specialSourceJar = "${gradle.gradleUserHomeDir}/caches/forge_gradle/maven_downloader/net/md-5/SpecialSource/1.8.3/SpecialSource-1.8.3-shaded.jar"
def ae2McpJar = file("$buildDir/testLibs/ae2-uel-mcp.jar")

task remapAe2ForTest(type: JavaExec) {
    // AE2-UEL 构件经 Ivy 直链解析进 Gradle 缓存, 在执行期定位实际文件
    inputs.file srgToMcpSrg
    outputs.file ae2McpJar
    outputs.upToDateWhen { ae2McpJar.exists() }
    main = 'net.md_5.specialsource.SpecialSource'
    classpath = files(specialSourceJar)
    doFirst {
        def ae2Jar = configurations.compile.find { it.name.startsWith('ae2-uel') }
        assert ae2Jar != null: 'AE2-UEL artifact not found in compile configuration'
        args = ['-i', ae2Jar.absolutePath, '-o', ae2McpJar.absolutePath, '-m', srgToMcpSrg]
    }
}

afterEvaluate {
    // 以 MCP 重映射版替换 test 运行时 classpath 中的 SRG 版 AE2 jar
    sourceSets.test.runtimeClasspath = sourceSets.test.runtimeClasspath
            .filter { !it.name.startsWith('ae2-uel') } + files(ae2McpJar)
}

mixin {
    add sourceSets.main, 'mixin.refmap.json'
}

// ----------------------------------------------------------------------------
// 资源处理: 展开 mcmod.info 中的 ${version} / ${mcversion} 模板变量
// ----------------------------------------------------------------------------
processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// ----------------------------------------------------------------------------
// runClient 时自动检测 HEI: 若 mods 文件夹中存在 HEI, 则排除原版 JEI jar,
// 避免原版 JEI 与 HEI 的类冲突; 若只有原版 JEI, 则保持兼容.
// ----------------------------------------------------------------------------
afterEvaluate {
    tasks.runClient {
        doFirst {
            def hasHEI = fileTree('run/mods').matching { include '**/HadEnoughItems*.jar' }.files.size() > 0
            if (hasHEI) {
                classpath = classpath.filter { file ->
                    !file.name.contains("jei_${project.minecraft_version}")
                }
                println "[AE2Enhanced] Detected HEI in run/mods, excluded vanilla JEI from runtime classpath."
            }
        }
    }
}

// ----------------------------------------------------------------------------
// 打包: 排除 JEI stub、按白名单打包 fastutil、写入 FML CorePlugin manifest
// ----------------------------------------------------------------------------
jar {
    // 排除 JEI 内部类的编译期 stub, 避免与运行时 JEI/HEI 的类冲突
    exclude 'mezz/jei/**'

    // fastutil 瘦身白名单: 本 mod + AE2-UEL 对 fastutil 静态引用(常量池)的传递闭包,
    // 由 research/tools/fastutil_closure.py 生成。fastutil 或 AE2 版本升级后需重新生成:
    //   python research/tools/fastutil_closure.py build/libs/AE2Enhanced-<version>.jar \
    //       libs/ae2-uel-v0.56.7.jar <gradle缓存中的fastutil.jar> fastutil-whitelist.txt
    def fastutilWhitelist = file('fastutil-whitelist.txt').readLines('UTF-8') as Set

    // 打包 fastutil, 仅保留白名单中的类
    from({
        configurations.compile.findAll { it.name.contains('fastutil') }.collect { zipTree(it) }
    }) {
        eachFile { fc ->
            if (fc.path.endsWith('.class') && fc.path.startsWith('it/unimi/dsi/fastutil/')
                    && !fastutilWhitelist.contains(fc.path)) {
                fc.exclude()
            }
        }
    }

    manifest {
        attributes([
            'FMLCorePluginContainsFMLMod': true,
            'ForceLoadAsMod': true,
            'FMLCorePlugin': 'com.github.aeddddd.ae2enhanced.mixin.AssemblyMixinPlugin'
        ])
    }
}
