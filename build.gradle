            }
        }
        if (providers.gradleProperty('ftbVerification').isPresent()) {
            ['FTBLib-5.4.7.2.jar', 'FTBUtilities-5.4.1.131.jar'].each { name ->
                copy { from new File(project.projectDir, "libs-unused/${name}"); into new File(root, 'mods') }
            }
        }
        if (providers.gradleProperty('mmceVerification').isPresent()) {
            def runtimeDir = new File(project.buildDir, 'verification/mmce')
            ['CraftTweaker2-MC1120-Main-1.12-4.1.20.718-srg.jar',
             'CraftTweaker2-API-4.1.20.718.jar', 'ZenScript-4.1.20.718.jar'].each { name ->
                copy { from new File(runtimeDir, name); into new File(root, 'mods') }
            }
            def mmceVersion = providers.gradleProperty('mmceVersion').orElse('2.2.2').get()
            copy {
                from new File(runtimeDir, "ModularMachinery-CE-${mmceVersion}.jar")
                into new File(root, 'mods')
