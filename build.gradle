tasks.register('verifyServerSmoke') {
    group = 'verification'
    description = 'Archives smoke logs and validates exit markers and Mixin failures.'
    outputs.upToDateWhen { false }
    doLast {
        def root = serverSmokeDir.get().asFile
        def report = serverSmokeReportDir.get().asFile
        def reportLogs = new File(report, 'logs')
        delete(reportLogs)
        reportLogs.mkdirs()
        copy {
            from(new File(root, 'logs')) { include '*.log' }
            into reportLogs
        }
        def latest = new File(root, 'logs/latest.log')
        if (!latest.isFile()) {
            throw new GradleException("serverSmokeTest failed: ${latest} was not created; process must also exit 0")
        }
        String logText = latest.getText('UTF-8')
        if (logText.count('SMOKE_PASS') != 1) {
            throw new GradleException('serverSmokeTest failed: latest.log must contain exactly one SMOKE_PASS')
        }
        if (logText.contains('SMOKE_FAIL')) {
            throw new GradleException('serverSmokeTest failed: latest.log contains SMOKE_FAIL')
        }
        if (providers.gradleProperty('guideVerification').isPresent() && logText.count('GUIDE_PASS') != 1) {
            throw new GradleException('serverSmokeTest failed: guide verification requires exactly one GUIDE_PASS')
        }
        if (providers.gradleProperty('ftbVerification').isPresent() && logText.count('FTB_PASS') != 1) {
            throw new GradleException('serverSmokeTest failed: FTB verification requires exactly one FTB_PASS')
        }
        if (providers.gradleProperty('mmceVerification').isPresent()
                && (logText.count('MMCE_PASS') != 1 || logText.count('MMCE_DISPATCH_PASS') != 1)) {
            throw new GradleException('serverSmokeTest failed: MMCE requires expansion and real dispatch markers')
        }
        def lines = logText.readLines()
        def mixinFatals = lines.findAll { line ->
            line =~ /(?i)(mixin.*(fatal|critical injection failure|apply failed)|InjectionError|InvalidMixinException)/
        }
        if (!mixinFatals.isEmpty()) {
            throw new GradleException('serverSmokeTest failed: unexempted Mixin fatal:\n' + mixinFatals.join('\n'))
        }
        def knownOverwrites = [
                'ae2enhanced$isItemChannel in mixins.ae2enhanced.late.tii.json:starlight.MixinNetworkMonitorStarlight',
                'ae2enhanced$notifyListeners in mixins.ae2enhanced.late.tii.json:starlight.MixinNetworkMonitorStarlight',
                'ae2enhanced$isItemChannel in mixins.ae2enhanced.late.fluid.json:fluid.MixinNetworkMonitorFluid',
                'ae2enhanced$notifyListeners in mixins.ae2enhanced.late.fluid.json:fluid.MixinNetworkMonitorFluid'
        ]
        def newOverwrites = lines.findAll { line ->
            line.contains('Method overwrite conflict') && !knownOverwrites.any { line.contains(it) }
        }
        if (!newOverwrites.isEmpty()) {
            throw new GradleException('serverSmokeTest failed: new Mixin overwrite conflict:\n' + newOverwrites.join('\n'))
        }
        logger.lifecycle('[AE2Enhanced] serverSmokeTest verified exactly one SMOKE_PASS; logs: ' + reportLogs)
    }
}

runServerSmoke.configure {
    finalizedBy verifyServerSmoke
