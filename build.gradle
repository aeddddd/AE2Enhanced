        report.mkdirs()
        def manifest = new StringBuilder()
        fileTree(new File(root, 'mods')).matching { include '*.jar' }.files.sort { it.name }.each { jarFile ->
            manifest.append(jarFile.name).append('  ')
                    .append(java.security.MessageDigest.getInstance('SHA-256').digest(jarFile.bytes)
                            .encodeHex().toString()).append('\n')
