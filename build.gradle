}

tasks.register('prepareIntegrationMods', Sync) {
    dependsOn cleanIntegration, reobfJar, reobfVerificationJar
    into integrationDir.map { new File(it.asFile, 'mods') }
    from(tasks.named('reobfJar'))
    from(tasks.named('reobfVerificationJar'))
    from(configurations.obfuscatedRuntimeClasspath) {
        rename { name -> name.startsWith('mixinbooter-') ? '!' + name : name }
    }
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
    exclude { details ->
        def name = details.file.name.toLowerCase(java.util.Locale.ROOT)
        name.endsWith('-dev.jar') || name.endsWith('-deobf.jar') ||
                name.contains('jei_') || name.contains('hadenoughitems')
    }
    doLast {
        def root = integrationDir.get().asFile
        root.mkdirs()
        new File(root, 'eula.txt').text = 'eula=true\n'
        new File(root, 'server.properties').text = '''server-port=0
online-mode=false
level-name=world
spawn-protection=0
max-tick-time=-1
sync-chunk-writes=false
'''
    }
}

def configureIntegrationLaunch = { JavaExec task, String phase ->
    task.workingDir = integrationDir
    task.standardInput = new ByteArrayInputStream(new byte[0])
    task.outputs.upToDateWhen { false }
    task.systemProperty 'ae2e.integration.mode', phase
    task.systemProperty 'ae2e.integration.watchdogSeconds', providers.gradleProperty('integrationWatchdogSeconds').orElse('300').get()
    task.doFirst {
        def launch = tasks.named('runObfServer').get()
        def integrationProperties = new LinkedHashMap(task.systemProperties)
        task.classpath = launch.classpath.filter { classPathFile ->
            def name = classPathFile.name.toLowerCase(java.util.Locale.ROOT)
            !name.endsWith('-dev.jar') && !name.endsWith('-deobf.jar') &&
                    !name.contains('jei_') && !name.contains('hadenoughitems')
        }
        task.mainClass.set(launch.mainClass.get())
        task.systemProperties = launch.systemProperties + integrationProperties
        task.setArgs(launch.calculateArgs() + ['--nogui'])
        task.jvmArgs launch.calculateJvmArgs()
        task.logger.lifecycle("[AE2Enhanced] integration ${phase} launcher: ${task.mainClass.get()}")
        task.logger.lifecycle("[AE2Enhanced] integration ${phase} directory: ${task.workingDir}")
    }
}

tasks.register('integrationWrite', JavaExec) {
    group = 'verification'
    description = 'Runs ordinary delivery, cancellation, and captures an in-flight job in JVM one.'
    dependsOn downloadVanillaJars, prepareIntegrationMods, reobfJar, reobfVerificationJar
    configureIntegrationLaunch(delegate, 'write')
}

tasks.register('verifyIntegrationWrite') {
    group = 'verification'
    outputs.upToDateWhen { false }
    doLast {
        def report = integrationReportDir.get().asFile
        report.mkdirs()
        def latest = new File(integrationDir.get().asFile, 'logs/latest.log')
        if (!latest.isFile()) {
            throw new GradleException('integrationWrite failed: latest.log missing; process must also exit 0')
        }
        copy { from latest; into report; rename { 'write-latest.log' } }
        def results = new File(integrationDir.get().asFile, 'integration-write-results.tsv')
        if (results.isFile()) {
            copy { from results; into report }
        }
        String logText = latest.getText('UTF-8')
        if (logText.count('INTEGRATION_WRITE_PASS') != 1 || logText.contains('INTEGRATION_FAIL')) {
            throw new GradleException('integrationWrite failed: ordinary/cancel/in-flight fixture did not complete')
        }
    }
}

integrationWrite.configure {
    finalizedBy verifyIntegrationWrite
}

tasks.register('integrationVerify', JavaExec) {
    group = 'verification'
    description = 'Reloads the same temporary world in JVM two and resumes the persisted CPU job.'
    dependsOn integrationWrite
    configureIntegrationLaunch(delegate, 'verify')
}

tasks.register('verifyIntegration') {
    group = 'verification'
    outputs.upToDateWhen { false }
    doLast {
        def root = integrationDir.get().asFile
        def report = integrationReportDir.get().asFile
        def latest = new File(root, 'logs/latest.log')
        if (!latest.isFile()) {
            throw new GradleException('integrationVerify failed: latest.log missing; process must also exit 0')
        }
        copy { from latest; into report; rename { 'verify-latest.log' } }
        def results = new File(root, 'integration-verify-results.tsv')
        if (results.isFile()) {
            copy { from results; into report }
        }
        def recovery = new File(root, 'integration-recovery.properties')
        if (recovery.isFile()) {
            copy { from recovery; into report }
        }
        String logText = latest.getText('UTF-8')
        if (logText.count('INTEGRATION_PASS') != 1 || logText.contains('INTEGRATION_FAIL')) {
            def known = logText.readLines().findAll { it.contains('INTEGRATION_KNOWN_DEFECT') }
            throw new GradleException('integrationTest failed: resumed grid/CPU scenario failed' +
                    (known.isEmpty() ? '' : '\n' + known.join('\n')))
        }
        logger.lifecycle('[AE2Enhanced] integrationTest verified exactly one INTEGRATION_PASS; reports: ' + report)
    }
}

integrationVerify.configure {
    finalizedBy verifyIntegration
}

tasks.register('integrationTest') {
    group = 'verification'
    description = 'M0 L3 real AE2 grid/CPU delivery, cancellation, and two-JVM recovery.'
    dependsOn integrationVerify
}
