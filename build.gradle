def configureScopeChainLaunch = { JavaExec task, String phase, String saveName ->
    def launchSaveName = providers.gradleProperty('storageVerification').isPresent() ? 'A' : saveName
    def saveRoot = scopeChainDir.map { new File(it.asFile, launchSaveName) }
    task.workingDir = saveRoot
    task.standardInput = new ByteArrayInputStream(new byte[0])
    task.outputs.upToDateWhen { false }
    task.systemProperty 'ae2e.smoke.enabled', true
    task.systemProperty 'ae2e.smoke.expectedVersion', project.version
    task.systemProperty 'ae2e.smoke.watchdogSeconds', serverSmokeWatchdog.get()
    task.systemProperty 'ae2e.smoke.scopeCase', phase
    task.systemProperty 'ae2e.smoke.scopeRoot', saveRoot.map { new File(it, 'world').absolutePath }.get()
    task.systemProperty 'ae2e.smoke.scopeJournal', scopeChainJournal.get().absolutePath
    if (providers.gradleProperty('storageVerification').isPresent()) {
        task.systemProperty 'ae2e.smoke.storagePhase', phase
    }
    task.doFirst {
        if (providers.gradleProperty('storageVerification').isPresent()) {
            def config = new File(saveRoot.get(), 'config/ae2enhanced.cfg')
            config.parentFile.mkdirs()
            config.text = 'general {\n    storagechannels {\n        B:energy=' + (phase == 'B' ? 'false' : 'true') + '\n    }\n}\n'
        }
        def launch = tasks.named('runObfServer').get()
        def chainProperties = new LinkedHashMap(task.systemProperties)
        task.classpath = launch.classpath.filter { classPathFile ->
            def name = classPathFile.name.toLowerCase(java.util.Locale.ROOT)
            !name.endsWith('-dev.jar') && !name.endsWith('-deobf.jar') &&
                    !name.contains('jei_') && !name.contains('hadenoughitems')
        }
        task.mainClass.set(launch.mainClass.get())
        task.systemProperties = launch.systemProperties + chainProperties
        task.setArgs(launch.calculateArgs() + ['--nogui'])
        task.jvmArgs launch.calculateJvmArgs()
        task.logger.lifecycle("[AE2Enhanced] scope chain ${phase} directory: ${task.workingDir}")
    }
    task.doLast {
        def latest = new File(saveRoot.get(), 'logs/latest.log')
        if (!latest.isFile() || latest.getText('UTF-8').count('SCOPE_CHAIN_PASS') != 1 ||
                latest.getText('UTF-8').contains('SMOKE_FAIL')) {
            throw new GradleException("M2a scope chain failed: ${phase} has no unique PASS marker")
        }
        copy { from latest; into scopeChainDir; rename { "${phase}-latest.log" } }
    }
}

