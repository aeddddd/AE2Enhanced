# -----------------------------------------------------------
# Gradle 运行时 (RFG 2.x 要求以 JDK 25 运行 Gradle; 编译/测试走 Java 8 工具链)
# -----------------------------------------------------------
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m
org.gradle.daemon=false

# -----------------------------------------------------------
# Mod 元数据
# -----------------------------------------------------------
mod_version=1.7.9.0
maven_group=com.github.aeddddd
archives_base_name=AE2Enhanced

# -----------------------------------------------------------
# Minecraft / Forge / Mappings
# Forge 版本由 RFG 内置默认固定为 14.23.5.2847 (1.12.2)
# -----------------------------------------------------------
minecraft_version=1.12.2
mapping_channel=stable
mapping_version=39

# -----------------------------------------------------------
# 依赖版本（Maven 依赖；libs/ 下的本地 jar 无需在此声明）
# -----------------------------------------------------------
fastutil_version=8.5.12
mixin_version=0.8.5
mixin_booter_version=10.6
jei_version=4.16.1.302
crafttweaker_version=1.12-4.1.20.574
junit_version=5.10.0
junit_platform_version=1.10.0
